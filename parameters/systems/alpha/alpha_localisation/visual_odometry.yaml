visual_odometry:
  ros__parameters:
    left_image_topic: /alpha/drivers/loccam/left
    right_image_topic: /alpha/drivers/loccam/right
    odometry_topic: /alpha/localisation/visual/odometry
    odom_frame: alpha/startup_fixed
    base_frame: alpha/base_link
    point_cloud_topic: /alpha/localisation/visual/point_cloud
    feature_image_topic: /alpha/localisation/visual/features
    reset_topic: /alpha/localisation/visual/reset
    fx_px: 800.0
    fy_px: 800.0
    cx_px: 512.0
    cy_px: 512.0
    stereo_baseline_m: 0.15
    camera_x_m: 0.932
    camera_z_m: 0.6
    camera_pitch_rad: 0.174533
    num_disparities: 128
    block_size: 15
    maximum_features: 640
    minimum_correspondences: 20
    maximum_depth_m: 25.0
    # Stereo depth (WP-01 Phase 5.3): "block" reads the dense StereoBM map
    # (num_disparities, block_size), rebuilt for the keyframe pair every
    # frame, at the nearest pixel; "sparse" matches each keyframe corner
    # once along its row to sub-pixel precision, with a left-right check.
    # Sparse became the default after the ab53 runs: same accuracy, 9 % more
    # valid depths, 64 ms instead of 87 ms median processing per frame.
    stereo_matching: sparse
    sparse_stereo_half_window_px: 5
    sparse_stereo_maximum_left_right_difference_px: 1.0
    # Rows above this are not searched for corners (sky and distant
    # terrain); 0 searches the whole image. Masking above row 400 lost 14 %
    # of detections and lowered the near/mid share (ab53), so it is off.
    detection_minimum_row_px: 0
    maximum_input_age_s: 0.25
    # Images kept per camera by the subscription and the stereo pair matcher
    # (1-10); a stale pair is still dropped by maximum_input_age_s. Depth 2
    # received 15 % more pairs than 1 with the same input age (ab54).
    image_queue_depth: 2
    maximum_keyframe_interval_s: 0.75
    # Parallax keyframes (WP-01 Phase 5.2): an accepted estimate keeps the
    # keyframe, and publishes nothing, until the tracked corners' median
    # image motion reaches keyframe_minimum_parallax_px, fewer than
    # keyframe_minimum_survival_ratio of them are still tracked, or it has
    # been kept keyframe_maximum_retention_s (<= maximum_keyframe_interval_s).
    # Zero thresholds advance on every accepted estimate. Frame-to-frame
    # parallax is only ~0.25 px at 0.017 m/s, so the retention limit is
    # what advances the keyframe in practice (~0.75 px per increment).
    keyframe_minimum_parallax_px: 3.0
    keyframe_minimum_survival_ratio: 0.5
    keyframe_maximum_retention_s: 0.5
    # Ready after this many consecutive accepted poses, until the pose is
    # lost or no pose is accepted for readiness_maximum_pose_gap_s.
    readiness_consecutive_poses: 3
    readiness_maximum_pose_gap_s: 3.0
    feature_grid_rows: 4
    feature_grid_columns: 4
    maximum_features_per_cell: 40
    near_mid_depth_m: 12.0
    minimum_inlier_coverage_ratio: 0.25
    minimum_near_mid_inlier_ratio: 0.25
    preferred_disparity_px: 8.0
    disparity_stddev_px: 1.0
    reprojection_noise_floor_px: 0.25
    maximum_pnp_normal_condition: 1.0e12
    minimum_translation_variance_m2: 1.0e-5
    maximum_translation_variance_m2: 4.0
    minimum_rotation_variance_rad2: 1.0e-6
    maximum_rotation_variance_rad2: 0.25
