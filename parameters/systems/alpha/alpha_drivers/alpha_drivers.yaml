# Topic names are not pinned here: each defaults under /<system>/... from
# the system_name parameter (/alpha/... when system_name is "alpha"), so
# these tunings apply unchanged under any system's own namespace.
alpha_driver_node:
  ros__parameters:
    noise_enabled: true
    random_seed: 7302028
    imu_angular_velocity_stddev_radps: 0.008
    imu_linear_acceleration_stddev_mps2: 0.05
    imu_orientation_stddev_rad: 0.003
    imu_angular_velocity_bias_radps:
    - 0.002
    - -0.001
    - 0.0015
    imu_linear_acceleration_bias_mps2:
    - 0.02
    - -0.015
    - 0.025
    wheel_position_stddev_rad: 0.002
    wheel_velocity_stddev_radps: 0.015
    joint_state_publish_rate_hz: 50.0
    # Command gate: forward wheel commands only while /<system>/system/state
    # is READY and no older than this (simulated seconds).
    maximum_state_heartbeat_age_s: 1.5
    # Ready while raw IMU and raw joint states are both this fresh.
    readiness_maximum_input_age_s: 0.5
    camera_pixel_stddev: 6.0
