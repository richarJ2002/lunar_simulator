# Alpha ros_gz_bridge configuration (Jazzy YAML sequence format).
# Ground-truth entry uses /alpha/localisation/ground_truth/odometry per D1.
- ros_topic_name: /clock
  gz_topic_name: /clock
  ros_type_name: rosgraph_msgs/msg/Clock
  gz_type_name: gz.msgs.Clock
  direction: GZ_TO_ROS
- ros_topic_name: /alpha/drivers/cmd/wheel_joint_states
  gz_topic_name: /alpha/drivers/cmd/wheel_joint_states
  ros_type_name: actuator_msgs/msg/Actuators
  gz_type_name: gz.msgs.Actuators
  direction: ROS_TO_GZ
- ros_topic_name: /alpha/drivers/imu
  gz_topic_name: /alpha/drivers/imu
  ros_type_name: sensor_msgs/msg/Imu
  gz_type_name: gz.msgs.IMU
  direction: GZ_TO_ROS
- ros_topic_name: /alpha/drivers/joint_states
  gz_topic_name: /alpha/drivers/joint_states
  ros_type_name: sensor_msgs/msg/JointState
  gz_type_name: gz.msgs.Model
  direction: GZ_TO_ROS
- ros_topic_name: /alpha/drivers/ground_truth/odometry
  gz_topic_name: /alpha/drivers/ground_truth/odometry
  ros_type_name: nav_msgs/msg/Odometry
  gz_type_name: gz.msgs.Odometry
  direction: GZ_TO_ROS
- ros_topic_name: /alpha/drivers/loccam/left
  gz_topic_name: /alpha/drivers/loccam/left
  ros_type_name: sensor_msgs/msg/Image
  gz_type_name: gz.msgs.Image
  direction: GZ_TO_ROS
- ros_topic_name: /alpha/drivers/loccam/right
  gz_topic_name: /alpha/drivers/loccam/right
  ros_type_name: sensor_msgs/msg/Image
  gz_type_name: gz.msgs.Image
  direction: GZ_TO_ROS
- ros_topic_name: /alpha/drivers/navcam/left
  gz_topic_name: /alpha/drivers/navcam/left
  ros_type_name: sensor_msgs/msg/Image
  gz_type_name: gz.msgs.Image
  direction: GZ_TO_ROS
- ros_topic_name: /alpha/drivers/navcam/right
  gz_topic_name: /alpha/drivers/navcam/right
  ros_type_name: sensor_msgs/msg/Image
  gz_type_name: gz.msgs.Image
  direction: GZ_TO_ROS
