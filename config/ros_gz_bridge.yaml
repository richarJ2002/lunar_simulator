# Alpha-only ros_gz_bridge configuration (Jazzy YAML sequence format).
# The Alpha rover is the ExoMars-derived rover; it uses /alpha exclusively.
- ros_topic_name: "/clock"
  gz_topic_name: "/clock"
  ros_type_name: "rosgraph_msgs/msg/Clock"
  gz_type_name: "gz.msgs.Clock"
  direction: GZ_TO_ROS
- ros_topic_name: "/alpha/cmd_wheel_joint_states"
  gz_topic_name: "/alpha/cmd_wheel_joint_states"
  ros_type_name: "actuator_msgs/msg/Actuators"
  gz_type_name: "gz.msgs.Actuators"
  direction: ROS_TO_GZ
- ros_topic_name: "/alpha/raw/imu"
  gz_topic_name: "/alpha/raw/imu"
  ros_type_name: "sensor_msgs/msg/Imu"
  gz_type_name: "gz.msgs.IMU"
  direction: GZ_TO_ROS
- ros_topic_name: "/alpha/raw/joint_states"
  gz_topic_name: "/alpha/raw/joint_states"
  ros_type_name: "sensor_msgs/msg/JointState"
  gz_type_name: "gz.msgs.Model"
  direction: GZ_TO_ROS
- ros_topic_name: "/localisation/ground_truth/odometry"
  gz_topic_name: "/alpha/odometry"
  ros_type_name: "nav_msgs/msg/Odometry"
  gz_type_name: "gz.msgs.Odometry"
  direction: GZ_TO_ROS
- ros_topic_name: "/alpha/loccam/left"
  gz_topic_name: "/alpha/loccam/left"
  ros_type_name: "sensor_msgs/msg/Image"
  gz_type_name: "gz.msgs.Image"
  direction: GZ_TO_ROS
- ros_topic_name: "/alpha/loccam/right"
  gz_topic_name: "/alpha/loccam/right"
  ros_type_name: "sensor_msgs/msg/Image"
  gz_type_name: "gz.msgs.Image"
  direction: GZ_TO_ROS
- ros_topic_name: "/alpha/navcam/left"
  gz_topic_name: "/alpha/navcam/left"
  ros_type_name: "sensor_msgs/msg/Image"
  gz_type_name: "gz.msgs.Image"
  direction: GZ_TO_ROS
- ros_topic_name: "/alpha/navcam/right"
  gz_topic_name: "/alpha/navcam/right"
  ros_type_name: "sensor_msgs/msg/Image"
  gz_type_name: "gz.msgs.Image"
  direction: GZ_TO_ROS
