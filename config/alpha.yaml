alpha_system_node:
  ros__parameters:
    estimate_topic: /localisation/kalman_filter/odometry
    estimated_path_topic: /localisation/kalman_filter/path
    map_frame: map
    estimated_base_frame: alpha/base_link
    path_maximum_poses: 5000
    path_sample_period_s: 0.1

alpha_sensor_node:
  ros__parameters:
    noise_enabled: true
    random_seed: 7302028

    raw_imu_topic: /alpha/raw/imu
    imu_topic: /alpha/imu
    imu_angular_velocity_stddev_radps: 0.008
    imu_linear_acceleration_stddev_mps2: 0.05
    imu_orientation_stddev_rad: 0.003
    imu_angular_velocity_bias_radps: [0.002, -0.001, 0.0015]
    imu_linear_acceleration_bias_mps2: [0.02, -0.015, 0.025]

    raw_joint_state_topic: /alpha/raw/joint_states
    joint_state_topic: /alpha/joint_states
    wheel_position_stddev_rad: 0.002
    wheel_velocity_stddev_radps: 0.015

    # Applied by launch_simulator through Gazebo's native camera model.
    # This is in 8-bit intensity levels and requires a simulator restart.
    camera_pixel_stddev: 6.0
